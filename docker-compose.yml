version: '3.8'

services:
  # SurrealDB service
  surreal:
    image: surrealdb/surrealdb:latest
    container_name: prizm_surreal
    command: start --bind 0.0.0.0:8000 --user root --pass root surrealkv:///data/database.db
    ports:
      - "8001:8000"
    volumes:
      - ./surreal_data:/data
    # Using a host bind mount instead of a Docker volume
    restart: unless-stopped
    networks:
      - prizm_network

  # API server service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prizm_api
    depends_on:
      - surreal
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    environment:
      - SURREALDB_URL=ws://surreal:8000/rpc  # Internal network uses container port
      - SURREALDB_NAMESPACE=rainbow
      - SURREALDB_DATABASE=test
      - SURREALDB_USERNAME=root
      - SURREALDB_PASSWORD=root
      - HOST=0.0.0.0
      - PORT=5000
    restart: unless-stopped
    networks:
      - prizm_network

# No need for named volumes as we're using a bind mount
# volumes:
#   surreal_data:
#     name: prizm_surreal_data

networks:
  prizm_network:
    name: prizm_network
